argocd:
  # Your assigned domain for Argo CD UI
  domain: argocd

# Argo CD version
image:
  repository: quay.io/argoproj/argocd
  tag: v3.6

# Resource limits
resources:
  server:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  repoServer:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  applicationController:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Enable ingress for web UI
ingress:
  enabled: true