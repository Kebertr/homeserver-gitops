---
# This ConfigMap will be created first by Helm, then patched by the install job
# The install job patches it to ensure the URL is set correctly after ArgoCD is installed
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
  name: argocd-cmd-params-cm
data:
  # Timeout settings
  timeout.reconciliation: 180s

  # Application settings
  application.instanceLabelKey: argocd.argoproj.io/instance

  server.insecure: "true"