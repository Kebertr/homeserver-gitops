apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: root
  namespace: argocd
# This finalizer is required to prevent the application from being deleted before its child applications are deleted
  finalizers:
  - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  source:
    repoURL: https://github.com/Kebertr/homeserver-gitops.git
    targetRevision: main
    path: applications

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
