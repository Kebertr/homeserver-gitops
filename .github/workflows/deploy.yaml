name: homeserver-gitops test

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: homeserver-gitops

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      
      - name: Build Kong dependencies
        run:  | 
          helm repo add kong https://charts.konghq.com
          helm repo update
          helm dependency build helm_charts/kong-gateway

      - name: Helm Lint Cloudflare
        run: helm lint helm_charts/cloudflare

      - name: Helm Lint Github Actions
        run: helm lint helm_charts/github-actions/gitops

      - name: Helm Lint Github Actions
        run: helm lint helm_charts/github-actions/terraform

      - name: Helm Lint Github Actions
        run: helm lint helm_charts/github-actions/valhall

      - name: Helm Lint MinIO
        run: helm lint helm_charts/minio

      - name: Helm Lint Nginx
        run: helm lint helm_charts/nginx

      - name: Helm Lint Prometheus
        run: helm lint helm_charts/prometheus

      - name: Helm Lint grafana
        run: helm lint helm_charts/grafana

      - name: Helm Lint postgres
        run: helm lint helm_charts/database-valhall/bong -f helm_charts/database-valhall/bong/values-prod.yaml

      - name: Helm Lint postgres dev
        run: helm lint helm_charts/database-valhall/bong -f helm_charts/database-valhall/bong/values-dev.yaml

      - name: Helm Lint member postgres
        run: helm lint helm_charts/database-valhall/member -f helm_charts/database-valhall/member/values-prod.yaml

      - name: Helm Lint member postgres dev
        run: helm lint helm_charts/database-valhall/member -f helm_charts/database-valhall/member/values-dev.yaml

      - name: Helm Lint bong
        run: helm lint helm_charts/backend-valhall/bong-valhall -f helm_charts/backend-valhall/bong-valhall/values-prod.yaml

      - name: Helm Lint bong dev
        run: helm lint helm_charts/backend-valhall/bong-valhall -f helm_charts/backend-valhall/bong-valhall/values-dev.yaml

      - name: Helm Lint member
        run: helm lint helm_charts/backend-valhall/member-valhall -f helm_charts/backend-valhall/member-valhall/values-prod.yaml

      - name: Helm Lint member dev
        run: helm lint helm_charts/backend-valhall/member-valhall -f helm_charts/backend-valhall/member-valhall/values-dev.yaml

      - name: Helm Lint frontend
        run: helm lint helm_charts/frontend-valhall -f helm_charts/frontend-valhall/values-prod.yaml

      - name: Helm Lint frontend dev
        run: helm lint helm_charts/frontend-valhall -f helm_charts/frontend-valhall/values-dev.yaml

      - name: Helm Lint keycloak
        run: helm lint helm_charts/keycloak

      - name: Helm Lint kong
        run: helm lint helm_charts/kong-gateway

      - name: Helm Render Cloudflare
        run: helm template test helm_charts/cloudflare > /dev/null

      - name: Helm Render Github Actions
        run: helm template test helm_charts/github-actions/gitops > /dev/null

      - name: Helm Render Github Actions
        run: helm template test helm_charts/github-actions/terraform > /dev/null

      - name: Helm Render Github Actions
        run: helm template test helm_charts/github-actions/valhall > /dev/null

      - name: Helm Render MinIO
        run: helm template test helm_charts/minio > /dev/null

      - name: Helm Render Nginx
        run: helm template test helm_charts/nginx > /dev/null
        
      - name: Helm Render Prometheus
        run: helm template test helm_charts/prometheus > /dev/null

      - name: Helm Render grafana
        run: helm template test helm_charts/grafana > /dev/null

      - name: Helm Render postgres
        run: helm template test helm_charts/database-valhall/bong -f helm_charts/database-valhall/bong/values-prod.yaml > /dev/null

      - name: Helm Render postgres dev
        run: helm template test helm_charts/database-valhall/bong -f helm_charts/database-valhall/bong/values-dev.yaml > /dev/null

      - name: Helm Render member postgres
        run: helm template test helm_charts/database-valhall/member -f helm_charts/database-valhall/member/values-prod.yaml > /dev/null

      - name: Helm Render member postgres dev
        run: helm template test helm_charts/database-valhall/member -f helm_charts/database-valhall/member/values-dev.yaml > /dev/null

      - name: Helm Render bong
        run: helm template test helm_charts/backend-valhall/bong-valhall -f helm_charts/backend-valhall/bong-valhall/values-prod.yaml > /dev/null

      - name: Helm Render bong dev
        run: helm template test helm_charts/backend-valhall/bong-valhall -f helm_charts/backend-valhall/bong-valhall/values-dev.yaml > /dev/null

      - name: Helm Render member
        run: helm template test helm_charts/backend-valhall/member-valhall -f helm_charts/backend-valhall/member-valhall/values-prod.yaml > /dev/null

      - name: Helm Render member dev
        run: helm template test helm_charts/backend-valhall/member-valhall -f helm_charts/backend-valhall/member-valhall/values-dev.yaml > /dev/null

      - name: Helm Render frontend
        run: helm template test helm_charts/frontend-valhall -f helm_charts/frontend-valhall/values-prod.yaml > /dev/null

      - name: Helm Render frontend dev
        run: helm template test helm_charts/frontend-valhall -f helm_charts/frontend-valhall/values-dev.yaml > /dev/null

      - name: Helm Render keycloak
        run: helm template test helm_charts/keycloak > /dev/null

      - name: Helm Render kong
        run: helm template test helm_charts/kong-gateway > /dev/null

      - name: Success
        run: echo "GitOps validation passed"


      
