{{- if gt (int .Values.replicas) 1 }}
{{- fail "Crafty supports only one replica sharing this data directory" }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-crafty
spec:
  serviceName: {{ .Release.Name }}-crafty-headless
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-crafty
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-crafty
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: prepare-storage
          image: busybox:1.37.0
          command: [sh, -ec]
          args:
            - |
              mkdir -p /storage/{{ .Values.persistence.directory | quote }}
              cd /storage/{{ .Values.persistence.directory | quote }}
              for folder in config servers backups logs import; do
                mkdir -p "$folder"
                chown 1000:0 "$folder"
                chmod 2770 "$folder"
              done
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /storage
      containers:
        - name: crafty
          image: {{ .Values.image | quote }}
          imagePullPolicy: Always
          securityContext:
            runAsUser: 1000
            runAsGroup: 0
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: minecraft
              containerPort: 25565
            - name: dashboard
              containerPort: 8443
          env:
            - name: TZ
              value: Europe/Stockholm
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
          volumeMounts:
            - name: data
              mountPath: /crafty/app/config
              subPath: {{ .Values.persistence.directory }}/config
            - name: data
              mountPath: /crafty/servers
              subPath: {{ .Values.persistence.directory }}/servers
            - name: data
              mountPath: /crafty/backups
              subPath: {{ .Values.persistence.directory }}/backups
            - name: data
              mountPath: /crafty/logs
              subPath: {{ .Values.persistence.directory }}/logs
            - name: data
              mountPath: /crafty/import
              subPath: {{ .Values.persistence.directory }}/import
          readinessProbe:
            tcpSocket:
              port: dashboard
            periodSeconds: 10
      volumes:
        - name: data
          hostPath:
            path: {{ .Values.persistence.mountPath | quote }}
            type: Directory
