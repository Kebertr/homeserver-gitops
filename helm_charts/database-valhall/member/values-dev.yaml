app:
  name: member-postgres
  statefulSetName: member-postgres-statefulset
  serviceName: member-postgres-service
  internalServiceName: member-postgresql-internal
  configMapName: member-postgres-config
  tailscaleHostname: member-postgres-dev

StorageClassName: local-path
Timezone: "Europe/Stockholm"

DBSecretName: member-postgres-credentials-dev
