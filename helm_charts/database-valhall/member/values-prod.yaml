app:
  name: postgres
  statefulSetName: postgres-statefulset
  serviceName: postgres-service
  internalServiceName: postgresql-internal
  configMapName: postgres-config
  tailscaleHostname: bong-postgres

StorageClassName: local-path
Timezone: "Europe/Stockholm"

DBSecretName: postgres-credentials
DBImage: postgres:16
DBResourceLimit: true
DBCPU: "2000m"
DBMemory: "2000Mi"
DBStorage: 20Gi
