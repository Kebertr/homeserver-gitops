app:
  name: postgres
  statefulSetName: postgres-statefulset
  serviceName: postgres-service
  internalServiceName: postgresql-internal
  configMapName: postgres-config
  tailscaleHostname: bong-postgres-dev

StorageClassName: local-path
Timezone: "Europe/Stockholm"

DBSecretName: postgres-credentials
DBImage: postgres:16
DBResourceLimit: true
DBCPU: "1000m"
DBMemory: "1000Mi"
DBStorage: 10Gi
