apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-api-tailscale
  namespace: minio
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: minio-service
      port:
        name: api
  tls:
    - hosts:
        - {{ .Values.MinioApiTailscaleHostname | quote }}
