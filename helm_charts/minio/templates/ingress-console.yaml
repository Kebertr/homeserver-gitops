apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-console-tailscale
  namespace: minio
  annotations:
    tailscale.com/hostname: {{ .Values.MinioConsoleHostname | quote }}
spec:
  ingressClassName: tailscale

  defaultBackend:
    service:
      name: minio-service
      port:
        number: 9001
