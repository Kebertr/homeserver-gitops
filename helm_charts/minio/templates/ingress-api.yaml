apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-api-kong
  namespace: minio
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    konghq.com/preserve-host: "true"
    konghq.com/strip-path: "false"
    konghq.com/request-buffering: "false"
    konghq.com/response-buffering: "false"
spec:
  ingressClassName: kong

  tls:
    - hosts:
        - {{ .Values.MinioApiDomain | quote }}
      secretName: {{ .Values.MinioApiTlsSecret }}

  rules:
    - host: {{ .Values.MinioApiDomain | quote }}
      http:
        paths:
          - path: "/{{ .Values.MinioPublicBucketProd }}"
            pathType: Prefix
            backend:
              service:
                name: minio-service
                port:
                  name: api
                
          - path: "/{{ .Values.MinioPublicBucketDev }}"
            pathType: Prefix
            backend:
              service:
                name: minio-service
                port:
                  name: api
