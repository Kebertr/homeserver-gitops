app:
  name: video-service
  replicas: 1
  port: 3003
domain: valhall.kebert.se
image:
  repository: ghcr.io/kebertr/valhall-video-api
  tag: build-19
database:
  host: video-postgres-service
  port: 5432
  secretName: video-postgres-credentials

migration:
  enabled: true
  command: "pnpm --filter videos-api exec prisma migrate deploy"
minio:
  endpoint: minio-service.minio.svc.cluster.local
  port: 9000
  useSSL: "false"
  bucket: valhall-videos
  secretName: video-minio-credentials
keycloak:
  url: https://auth.kebert.se
  realm: valhall
  clientId: valhall-api
grpc:
  memberUrl: member-service:50051
frontendUrl: https://valhall.kebert.se