apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: member-service
spec:
  ingressClassName: kong
  rules:
    - host: {{ .Values.domain }}
      http:
        paths:
          - path: /api/members
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.app.name }}
                port:
                  number: 80