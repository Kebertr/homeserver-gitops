apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: {{ .Values.runnerScaleSetName }}
  namespace: argocd

spec:
  project: default

  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.14.2

    helm:
      values: |
        runnerScaleSetName: {{ .Values.runnerScaleSetName }}
        githubConfigUrl: {{ .Values.githubConfigUrl }}
        githubConfigSecret: {{ .Values.githubConfigSecret }}
        minRunners: {{ .Values.minRunners }}
        maxRunners: {{ .Values.maxRunners }}

  destination:
    server: https://kubernetes.default.svc
    namespace: git-runner

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
