apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
data:
  config.yaml: |
    tunnel: {{ .Values.tunnel }}
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: {{ .Values.hostname | quote}}
        service: {{ .Values.service.url }}
      - service: http_status:404