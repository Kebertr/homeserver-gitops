apiVersion: v1
kind: Service
metadata:
  name: graphdb
spec:
  type: ClusterIP
  selector:
    app: graphdb
  ports:
    - name: http
      port: 7200
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: graphdb-internal
spec:
  clusterIP: None
  selector:
    app: graphdb
  ports:
    - name: http
      port: 7200
      targetPort: http
