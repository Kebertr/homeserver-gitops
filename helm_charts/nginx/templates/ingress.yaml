apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{ .Values.app.name }}

spec:
  ingressClassName: traefik

  rules:
  - host: {{ .Values.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix

        backend:
          service:
            name: {{ .Values.app.name }}

            port:
              number: 80