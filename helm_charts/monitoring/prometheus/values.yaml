app:
  name: prometheus
  replicas: 1
  namespace: monitoring

images:
  prometheus:
    repository: prom/prometheus
    tag: v2.45.0
    pullPolicy: IfNotPresent

prometheus:
  enabled: true
  retention: 15d
  scrapeInterval: 30s
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 5000m
      memory: 1Gi