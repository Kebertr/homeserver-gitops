apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-ingress
  namespace: {{ .Values.app.namespace }}
  annotations:
    tailscale.com/hostname: "{{ .Values.app.name }}"
spec:
  ingressClassName: tailscale

  defaultBackend:
    service:
      name: {{ .Values.app.name }}
      port:
        number: 9090
