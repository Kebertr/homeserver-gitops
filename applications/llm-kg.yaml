apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llm-kg
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kebertr/homeserver-gitops.git
    targetRevision: main
    path: helm_charts/llm-kg
  destination:
    server: https://kubernetes.default.svc
    namespace: llm-kg
  # Sync manually after provisioning secrets and confirming runtime settings.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
