apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: database-video
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Kebertr/homeserver-gitops.git
    targetRevision: main
    path: helm_charts/database-valhall/video
    helm:
      valueFiles:
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: valhall-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
        - CreateNamespace=true
