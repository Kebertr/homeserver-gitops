apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-valhall
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Kebertr/homeserver-gitops.git
    targetRevision: main
    path: helm_charts/frontend-valhall
    helm:
      valueFiles:
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: valhall

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
