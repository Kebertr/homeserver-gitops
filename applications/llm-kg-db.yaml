apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: database-llm-kg
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kebertr/homeserver-gitops.git
    targetRevision: main
    path: helm_charts/database-llm-kg
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: llm-kg
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
