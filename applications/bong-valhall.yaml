apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bong-api
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Kebertr/homeserver-gitops.git
    targetRevision: main
    path: helm_charts/backend-valhall/bong-valhall

  destination:
    server: https://kubernetes.default.svc
    namespace: valhall

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true